name: video-ingest-agent-integration

services:
  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    volumes:
      - ../../../docker/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "18888:8888"

  source:
    image: surveillance/video-ingest-agent:integration
    entrypoint: ["ffmpeg"]
    command:
      - -hide_banner
      - -loglevel
      - warning
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=640x360:rate=15
      - -pix_fmt
      - yuv420p
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "30"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/source
    depends_on:
      - mediamtx
    restart: on-failure

  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: surveillance/video-ingest-agent:integration
    environment:
      AGENT_ID: integration-agent
      AGENT_BIND: 0.0.0.0:8098
      AGENT_API_TOKEN: integration-token
      AGENT_READY_TIMEOUT_SECONDS: "20"
      AGENT_OUTPUT_READY_TIMEOUT_SECONDS: "20"
      AGENT_OUTPUT_HEALTH_INTERVAL_SECONDS: "5"
      AGENT_MAX_PIPELINES: "2"
      AGENT_MAX_CONCURRENT_PROBES: "2"
    ports:
      - "18098:8098"
    depends_on:
      - mediamtx
