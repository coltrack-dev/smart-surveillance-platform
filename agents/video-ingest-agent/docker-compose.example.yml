services:
  video-ingest-agent:
    build: .
    container_name: surveillance-video-ingest-agent
    restart: unless-stopped
    environment:
      AGENT_ID: media-node-01
      AGENT_BIND: 0.0.0.0:8098
      AGENT_DATA_DIR: /data
      AGENT_API_TOKEN: ${VIDEO_INGEST_AGENT_TOKEN:?set VIDEO_INGEST_AGENT_TOKEN}
      AGENT_OUTPUT_STALL_TIMEOUT_SECONDS: ${VIDEO_INGEST_AGENT_OUTPUT_STALL_TIMEOUT_SECONDS:-15}
      RUST_LOG: info
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - ./data/video-ingest-agent:/data
    networks:
      - surveillance

networks:
  surveillance:
    external: true
