############################################
# MediaMTX configuration
# Sprint 3 (MVP)
############################################

logLevel: info

rtsp: yes
hls: yes

# MediaMTX постоянно поддерживает HLS-плейлист для опубликованных потоков.
# Браузеру не придётся ожидать появления следующего ключевого кадра.
hlsAlwaysRemux: yes

paths:
  test: {}
  people: {}         # локальный файл people.mp4
  people-2: {}         # локальный файл people.mp4
  i287: {}           # дорожная камера
  # UUID paths are created dynamically when video-ingest-agent publishes them.
  all_others: {}
