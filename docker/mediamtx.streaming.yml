# Streaming profile. docker-compose.streaming.yml supplies every indexed user
# field through MTX_AUTHINTERNALUSERS_*; MediaMTX 1.13.1 reconstructs the list
# from environment variables, so permission entries must be included there.
# MediaMTX stays on the private Compose network.
logLevel: info
rtsp: yes
hls: yes
api: no
metrics: no
pprof: no
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 6
hlsSegmentDuration: 2s

authMethod: internal
authInternalUsers: []

paths:
  all_others: {}
