server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: camera-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/cameras/**


            - id: stream-service
              uri: http://localhost:8094
              predicates:
                - Path=/api/streams/**


            - id: recording-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/recordings/**

  management:
    endpoints:
      web:
        exposure:
          include: health,info
