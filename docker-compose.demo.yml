name: surveillance-demo

services:

  volume-permissions:
    image: alpine:3.22
    container_name: surveillance-volume-permissions
    user: "0:0"
    volumes:
      - hls-data:/data/hls
      - recording-data:/data/recordings
      - playback-cache:/data/playback-cache
    command:
      - sh
      - -c
      - |
        chown -R 999:999 \
          /data/hls \
          /data/recordings \
          /data/playback-cache
    restart: "no"

  #  postgres:
  #    image: postgres:16.4-alpine
  #    container_name: surveillance-postgres
  #  environment:
  #    POSTGRES_DB: ${POSTGRES_DB:-surveillance_db}
  #    POSTGRES_USER: ${POSTGRES_USER:-surveillance_user}
  #    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surveillance_password}
  #  volumes:
  #    - postgres-data:/var/lib/postgresql/data
  #  healthcheck:
  #    test:
  #      - CMD-SHELL
  #      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
  #    interval: 5s
  #    timeout: 5s
  #    retries: 20
  #  restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: surveillance-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      #KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://192.168.13.128:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka-data:/var/lib/kafka/data

    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    container_name: surveillance-mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  # Источник №1: настроечная таблица
  rtsp-test-publisher:
    image: linuxserver/ffmpeg:7.1.1
    container_name: surveillance-rtsp-test-publisher
    depends_on:
      - mediamtx
    cpus: "0.50"
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc=size=640x360:rate=15
      - -f
      - lavfi
      - -i
      - sine=frequency=1000
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -c:a
      - aac
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/test
    restart: unless-stopped

  # Источник №2: зацикленное видео people.mp4
  rtsp-file-publisher:
    image: linuxserver/ffmpeg:7.1.1
    container_name: surveillance-rtsp-file-publisher
    depends_on:
      - mediamtx
    cpus: "1.00"
    volumes:
      - ./data/analytics/input:/videos:ro
    command:
      - -re
      - -stream_loop
      - "-1"
      - -i
      - /videos/people.mp4
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -an
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/people
    restart: unless-stopped

  # Тестовый источник №3: второй RTSP-поток из того же people.mp4
  rtsp-file-publisher-2:
    image: linuxserver/ffmpeg:7.1.1
    container_name: surveillance-rtsp-file-publisher-2
    depends_on:
      - mediamtx
    cpus: "1.00"
    volumes:
      - ./data/analytics/input:/videos:ro
    command:
      - -re
      - -stream_loop
      - "-1"
      - -ss
      - "15"
      - -i
      - /videos/people.mp4
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -an
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/people-2
    restart: unless-stopped

  # I-287 Just East of Interchange 5 (Route 119)
  rtsp-i287-publisher:
    image: linuxserver/ffmpeg:7.1.1
    container_name: surveillance-rtsp-i287-publisher

    depends_on:
      - mediamtx

    command:
      - -hide_banner
      - -loglevel
      - warning
      - -rw_timeout
      - "15000000"
      - -user_agent
      - Mozilla/5.0
      - -i
      - https://s58.nysdot.skyvdn.com:443/rtplive/TA_006/playlist.m3u8
      - -map
      - 0:v:0
      - -an
      - -vf
      - fps=15,scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2
      - -c:v
      - libx264
      - -preset
      - veryfast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "30"
      - -keyint_min
      - "30"
      - -sc_threshold
      - "0"
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/i287
    cpus: "1.5"
    mem_limit: 1g

    restart: unless-stopped


  camera-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:camera-service
        MODULE_DIR: services/camera-service
    image: surveillance/camera-service:demo
    container_name: surveillance-camera-service
    environment:
      #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-surveillance_db}
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.13.128:5432/${POSTGRES_DB:-surveillance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-surveillance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-surveillance_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ANALYTICS_JOBS_TOPIC: analytics.jobs
      ANALYTICS_JOB_STATUS_TOPIC: analytics.job-status
      ANALYTICS_WORKER_HEARTBEAT_TOPIC: analytics.worker-heartbeat
      ANALYTICS_CONTROL_GROUP_ID: analytics-service-control
      ANALYTICS_WORKER_ONLINE_TIMEOUT: 45s
      JAVA_OPTS: ${CAMERA_JAVA_OPTS:--Xms128m -Xmx384m}
    depends_on:
      #postgres:
      #  condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  stream-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:stream-service
        MODULE_DIR: services/stream-service
    image: surveillance/stream-service:demo
    container_name: surveillance-stream-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMERA_SERVICE_URL: http://camera-service:8091
      STREAM_HLS_PATH: /data/hls
      JAVA_OPTS: ${STREAM_JAVA_OPTS:--Xms128m -Xmx384m}
    volumes:
      - hls-data:/data/hls
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      camera-service:
        condition: service_started
      mediamtx:
        condition: service_started
    restart: unless-stopped

  recording-service:
    ports:
      - "8095:8095"
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:recording-service
        MODULE_DIR: services/recording-service
    image: surveillance/recording-service:demo
    container_name: surveillance-recording-service
    environment:
      #SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-surveillance_db}
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.13.128:5432/${POSTGRES_DB:-surveillance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-surveillance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-surveillance_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      CAMERA_SERVICE_URL: http://camera-service:8091

      RECORDING_STORAGE_PATH: /data/recordings
      RECORDING_PLAYBACK_CACHE_DIRECTORY: /data/playback-cache
      RECORDING_EXPORT_ENABLED: ${RECORDING_EXPORT_ENABLED:-true}
      RECORDING_S3_ENABLED: ${RECORDING_S3_ENABLED:-true}

      WASABI_ENDPOINT: ${WASABI_ENDPOINT:-http://unused.invalid}
      WASABI_BUCKET: ${WASABI_BUCKET:-unused}
      WASABI_ACCESS_KEY: ${WASABI_ACCESS_KEY:-unused}
      WASABI_SECRET_KEY: ${WASABI_SECRET_KEY:-unused}
      WASABI_REGION: ${WASABI_REGION:-us-central-1}

      JAVA_OPTS: ${RECORDING_JAVA_OPTS:--Xms128m -Xmx512m}
    volumes:
      - recording-data:/data/recordings
      - playback-cache:/data/playback-cache
    depends_on:
      volume-permissions:
        condition: service_completed_successfully
      #postgres:
      #  condition: service_healthy
      kafka:
        condition: service_started
      camera-service:
        condition: service_started
    restart: unless-stopped

  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:websocket-service
        MODULE_DIR: services/websocket-service
    image: surveillance/websocket-service:demo
    container_name: surveillance-websocket-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JAVA_OPTS: ${WEBSOCKET_JAVA_OPTS:--Xms96m -Xmx256m}
    depends_on:
      - kafka
    restart: unless-stopped

  camera-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: gateway:camera-gateway
        MODULE_DIR: gateway/camera-gateway
    image: surveillance/camera-gateway:demo
    container_name: surveillance-camera-gateway
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms96m -Xmx256m}
      CAMERA_SERVICE_URL: http://camera-service:8091
      STREAM_SERVICE_URL: http://stream-service:8094
      RECORDING_SERVICE_URL: http://recording-service:8095
      WEBSOCKET_SERVICE_URL: ws://websocket-service:8096
      ANALYTICS_SERVICE_URL: http://host.docker.internal:8097
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${DEMO_PORT:-8080}:8080"
    depends_on:
      - camera-service
      - stream-service
      - recording-service
      - websocket-service
    restart: unless-stopped

  analytics-service:
    profiles:
      # пока что запускать и gradle
      - container-analytics
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:analytics-service
        MODULE_DIR: services/analytics-service

    image: surveillance/analytics-service:demo
    container_name: surveillance-analytics-service

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://192.168.13.128:5432/${POSTGRES_DB:-surveillance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-surveillance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-surveillance_password}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      WASABI_ENDPOINT: ${WASABI_ENDPOINT}
      WASABI_BUCKET: ${WASABI_BUCKET}
      WASABI_ACCESS_KEY: ${WASABI_ACCESS_KEY}
      WASABI_SECRET_KEY: ${WASABI_SECRET_KEY}
      WASABI_REGION: ${WASABI_REGION:-us-central-1}

      ANALYTICS_SNAPSHOTS_S3_PREFIX: ${ANALYTICS_SNAPSHOTS_S3_PREFIX:-analytics/snapshots}

      JAVA_OPTS: ${ANALYTICS_JAVA_OPTS:--Xms128m -Xmx384m}

    depends_on:
      kafka:
        condition: service_started

      camera-service:
        condition: service_started

    restart: unless-stopped

  inference-worker:
    profiles:
      - inference
    build:
      context: .
      dockerfile: workers/inference-worker/Dockerfile

    image: surveillance/inference-worker:demo
    container_name: surveillance-inference-worker

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # A remote GPU node can consume both legacy recording events and
      # explicitly scheduled analytics jobs.
      KAFKA_INPUT_TOPICS: ${KAFKA_INPUT_TOPICS:-recording.events,analytics.jobs}
      KAFKA_TOPIC: analytics.events
      KAFKA_CONSUMER_GROUP: inference-workers
      KAFKA_AUTO_OFFSET_RESET: earliest
      KAFKA_MAX_POLL_INTERVAL_MS: "86400000"
      ANALYTICS_JOB_STATUS_TOPIC: ${ANALYTICS_JOB_STATUS_TOPIC:-analytics.job-status}
      ANALYTICS_WORKER_HEARTBEAT_TOPIC: ${ANALYTICS_WORKER_HEARTBEAT_TOPIC:-analytics.worker-heartbeat}
      INFERENCE_WORKER_ID: ${INFERENCE_WORKER_ID:-demo-inference-worker}
      INFERENCE_HEARTBEAT_SECONDS: ${INFERENCE_HEARTBEAT_SECONDS:-15}
      INFERENCE_MAX_CONCURRENT_JOBS: ${INFERENCE_MAX_CONCURRENT_JOBS:-1}
      INFERENCE_EXECUTION_MODE: ${INFERENCE_EXECUTION_MODE:-process}
      INFERENCE_MAX_CAMERAS: ${INFERENCE_MAX_CAMERAS:-8}
      INFERENCE_BATCH_SIZE: ${INFERENCE_BATCH_SIZE:-4}
      INFERENCE_BATCH_MAX_WAIT_MS: ${INFERENCE_BATCH_MAX_WAIT_MS:-20}
      INFERENCE_SNAPSHOT_WORKERS: ${INFERENCE_SNAPSHOT_WORKERS:-2}
      INFERENCE_RTSP_RECONNECT_MAX_SECONDS: ${INFERENCE_RTSP_RECONNECT_MAX_SECONDS:-30}

      WASABI_ENDPOINT: ${WASABI_ENDPOINT}
      WASABI_BUCKET: ${WASABI_BUCKET}
      WASABI_ACCESS_KEY: ${WASABI_ACCESS_KEY}
      WASABI_SECRET_KEY: ${WASABI_SECRET_KEY}
      WASABI_REGION: ${WASABI_REGION:-us-central-1}
      ANALYTICS_SNAPSHOTS_S3_PREFIX: ${ANALYTICS_SNAPSHOTS_S3_PREFIX:-analytics/snapshots}

      RECORDING_SERVICE_URL: http://recording-service:8095
      INFERENCE_WORK_DIRECTORY: /data/work

      ANALYTICS_SNAPSHOTS_DIRECTORY: /data/analytics/snapshots
      ANALYTICS_SNAPSHOTS_PUBLIC_PATH: /api/v1/analytics/snapshots
      ANALYTICS_SNAPSHOT_JPEG_QUALITY: ${ANALYTICS_SNAPSHOT_JPEG_QUALITY:-75}

      YOLO_MODEL: ${YOLO_MODEL:-/models/yolo11n.pt}
      YOLO_CONFIDENCE: ${YOLO_CONFIDENCE:-0.5}
      YOLO_CLASSES: ${YOLO_CLASSES:-0}
      LINE_POSITION: ${LINE_POSITION:-0.5}
      ANALYTICS_TARGET_FPS: ${ANALYTICS_TARGET_FPS:-10}
      RTSP_RECONNECT_SECONDS: ${RTSP_RECONNECT_SECONDS:-5}

      KAFKA_ENABLED: "true"

    volumes:
    #  - analytics-snapshots:/data/analytics/snapshots
      - inference-work:/data/work
      - inference-models:/models

    depends_on:
      kafka:
        condition: service_started

      recording-service:
        condition: service_started

    cpus: "2.0"
    mem_limit: 4g

    #restart: unless-stopped
    restart: no

volumes:
  #postgres-data:
  kafka-data:
  hls-data:
  recording-data:
  playback-cache:
  #analytics-snapshots:
  inference-work:
  inference-models:
