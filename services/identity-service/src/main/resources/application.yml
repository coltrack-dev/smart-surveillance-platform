spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://streaming-postgres:5432/streaming}
    username: ${SPRING_DATASOURCE_USERNAME:streaming}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://streaming-postgres:5432/streaming}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:streaming}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    schemas: identity
    default-schema: identity
    table: flyway_identity_schema_history
    create-schemas: true

server:
  port: 8099

identity:
  quotas:
    default-plan: ${IDENTITY_QUOTAS_DEFAULT_PLAN:FREE}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    oidc:
      issuer-uri: ""
      jwk-set-uri: ""
      audience: ""
