spring:
  application:
    name: stream-service

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: stream-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.coltrack.events

    producer:
      client-id: stream-service-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8094

camera-service:
  url: http://localhost:8091

stream:
  hls:
    #path: /opt/surveillance/hls
    path: ./data/hls
  rtsp:
    probe-timeout: ${STREAM_RTSP_PROBE_TIMEOUT:10s}
    playlist-timeout: ${STREAM_RTSP_PLAYLIST_TIMEOUT:30s}
    stale-playlist-timeout: ${STREAM_RTSP_STALE_PLAYLIST_TIMEOUT:15s}
    reconnect-max-delay: ${STREAM_RTSP_RECONNECT_MAX_DELAY:30s}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: stream-service
