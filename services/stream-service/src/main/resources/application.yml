spring:
  application:
    name: stream-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:192.168.13.128}:${POSTGRES_PORT:5432}/${POSTGRES_DB:surveillance_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:surveillance_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:surveillance_password}}
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:192.168.13.128}:${POSTGRES_PORT:5432}/${POSTGRES_DB:surveillance_db}}}
    user: ${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:surveillance_user}}}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:surveillance_password}}}
    table: flyway_stream_schema_history
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: stream-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.coltrack.events

    producer:
      client-id: stream-service-producer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8094

camera-service:
  url: ${CAMERA_SERVICE_URL:http://localhost:8091}

stream:
  ingest-agent:
    enabled: ${STREAM_INGEST_AGENT_ENABLED:false}
    base-url: ${STREAM_INGEST_AGENT_URL:http://localhost:8098}
    token: ${STREAM_INGEST_AGENT_TOKEN:}
    poll-interval: ${STREAM_INGEST_AGENT_POLL_INTERVAL:1s}
    publish-rtsp-base-url: ${STREAM_INGEST_AGENT_PUBLISH_RTSP_BASE_URL:rtsp://localhost:8554}
    internal-hls-base-url: ${STREAM_INGEST_AGENT_INTERNAL_HLS_BASE_URL:http://localhost:8888}
    public-hls-prefix: ${STREAM_INGEST_AGENT_PUBLIC_HLS_PREFIX:/media-hls}
    hls-ready-timeout: ${STREAM_INGEST_AGENT_HLS_READY_TIMEOUT:30s}
    hls-health-interval: ${STREAM_INGEST_AGENT_HLS_HEALTH_INTERVAL:5s}
    hls-failure-threshold: ${STREAM_INGEST_AGENT_HLS_FAILURE_THRESHOLD:2}

  hls:
    #path: /opt/surveillance/hls
    path: ./data/hls
  rtsp:
    probe-timeout: ${STREAM_RTSP_PROBE_TIMEOUT:10s}
    playlist-timeout: ${STREAM_RTSP_PLAYLIST_TIMEOUT:30s}
    stale-playlist-timeout: ${STREAM_RTSP_STALE_PLAYLIST_TIMEOUT:15s}
    reconnect-max-delay: ${STREAM_RTSP_RECONNECT_MAX_DELAY:30s}

broadcast:
  management-token: ${BROADCAST_MANAGEMENT_TOKEN:local-demo-broadcast-management-token}
  playback-secret: ${BROADCAST_PLAYBACK_SECRET:local-demo-broadcast-playback-secret-change-me}
  playback-ttl: ${BROADCAST_PLAYBACK_TTL:PT10M}
  viewer-session-ttl: ${BROADCAST_VIEWER_SESSION_TTL:PT90S}
  player-base-url: ${BROADCAST_PLAYER_BASE_URL:http://localhost:5173/watch}
  media-read-username: ${STREAMING_MEDIA_READ_USER:stream-reader}
  media-read-password: ${STREAMING_MEDIA_READ_PASSWORD:local-demo-media-read-password}
  media-hls-base-url: ${STREAM_INGEST_AGENT_INTERNAL_HLS_BASE_URL:http://localhost:8888}
  rate-limit-per-minute: ${BROADCAST_RATE_LIMIT_PER_MINUTE:300}
  security-mode: ${APP_SECURITY_MODE:}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: stream-service

app:
  security:
    mode: ${APP_SECURITY_MODE:}
    oidc:
      issuer-uri: ${APP_SECURITY_OIDC_ISSUER_URI:}
      jwk-set-uri: ${APP_SECURITY_OIDC_JWK_SET_URI:}
      audience: ${APP_SECURITY_OIDC_AUDIENCE:}

identity:
  quotas:
    default-plan: ${IDENTITY_QUOTAS_DEFAULT_PLAN:FREE}

streaming:
  internal:
    workload-secret: ${STREAMING_INTERNAL_JWT_SECRET:}
