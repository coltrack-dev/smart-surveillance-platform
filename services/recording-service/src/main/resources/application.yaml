server:
  port: 8095

spring:
  application:
    name: recording-service

  datasource:
    url: jdbc:postgresql://192.168.13.128:5432/surveillance_db
    username: surveillance_user
    password: surveillance_password

  jpa:
    hibernate:
      ddl-auto: update

#  autoconfigure:
#    exclude:
#      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: recording-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.coltrack.*


# Camera service connection
camera-service:
  url: http://localhost:8091

stream-service:
  url: http://localhost:8094


# Recording storage
recording:
  storage:
    path: data/recordings
    warning-threshold-percent: ${RECORDING_STORAGE_WARNING_THRESHOLD_PERCENT:20}
    critical-threshold-percent: ${RECORDING_STORAGE_CRITICAL_THRESHOLD_PERCENT:10}
    maximum-local-size: ${RECORDING_STORAGE_MAXIMUM_LOCAL_SIZE:100GB}
    cleanup-target-percent: ${RECORDING_STORAGE_CLEANUP_TARGET_PERCENT:90}
    retention-days: ${RECORDING_STORAGE_RETENTION_DAYS:30}
    minimum-free-percent: ${RECORDING_STORAGE_MINIMUM_FREE_PERCENT:15}
    emergency-free-percent: ${RECORDING_STORAGE_EMERGENCY_FREE_PERCENT:5}
    max-recordings-per-run: ${RECORDING_STORAGE_MAX_RECORDINGS_PER_RUN:100}
    delete-local-only-enabled: ${RECORDING_STORAGE_DELETE_LOCAL_ONLY_ENABLED:false}
  export:
    enabled: true
    endpoint: ${WASABI_ENDPOINT}
    bucket:  ${WASABI_BUCKET}
    access-key: ${WASABI_ACCESS_KEY}
    secret-key: ${WASABI_SECRET_KEY}
    region:  ${WASABI_REGION:us-central-1}
    delete-local-after-upload: false
  s3:
    enabled: true
    endpoint: ${WASABI_ENDPOINT}
    bucket:  ${WASABI_BUCKET}
    access-key: ${WASABI_ACCESS_KEY}
    secret-key: ${WASABI_SECRET_KEY}
    region: ${WASABI_REGION:us-central-1}
  playback:
    cache-directory: ./data/playback-cache
    ttl: 1h
    segment-duration-seconds: 4
    ffmpeg-path: ffmpeg

# FFmpeg settings
ffmpeg:
  path: ffmpeg

  recording:
    format: mp4
    video-codec: copy
    audio-enabled: false


# Actuator
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}


# Logging
logging:
  level:
    root: INFO

    com.coltrack.recordingservice: DEBUG

    org.apache.kafka: WARN
