plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.coltrack'
version = '0.0.1-SNAPSHOT'
description = 'camera-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation project(':common:common-events')
    implementation project(':common:common-kafka')
    implementation project(':common:common-logging')

    //implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    //implementation 'org.bytedeco:javacv-platform:1.5.10'
    implementation 'org.bytedeco:javacv:1.5.10'
    implementation 'org.bytedeco:ffmpeg:6.1.1-1.5.10'
    runtimeOnly 'org.bytedeco:ffmpeg:6.1.1-1.5.10:linux-x86_64'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
    useJUnitPlatform()
}
