spring:
  application:
    name: camera-service

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_camera_schema_history
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:192.168.13.128}:${POSTGRES_PORT:5432}/${POSTGRES_DB:surveillance_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:surveillance_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:surveillance_password}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coltrack.*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


environment:
  ANALYTICS_SERVICE_URL: http://analytics-service:8097

server:
  port: 8091

app:
  security:
    mode: ${APP_SECURITY_MODE:legacy}
    oidc:
      issuer-uri: ${APP_SECURITY_OIDC_ISSUER_URI:}
      jwk-set-uri: ${APP_SECURITY_OIDC_JWK_SET_URI:}
      audience: ${APP_SECURITY_OIDC_AUDIENCE:}
    internal:
      workload-secret: ${STREAMING_INTERNAL_JWT_SECRET:}

identity:
  quotas:
    default-plan: ${IDENTITY_QUOTAS_DEFAULT_PLAN:FREE}

camera:
  credentials:
    key: ${CAMERA_CREDENTIALS_KEY:}

