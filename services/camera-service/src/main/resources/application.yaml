spring:
  application:
    name: camera-service

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_camera_schema_history
    baseline-on-migrate: true
    baseline-version: 0

  datasource:
    url: jdbc:postgresql://192.168.13.128:5432/surveillance_db
    username: surveillance_user
    password: surveillance_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.coltrack.*"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


environment:
  ANALYTICS_SERVICE_URL: http://analytics-service:8097

server:
  port: 8091

camera:
  credentials:
    key: ${CAMERA_CREDENTIALS_KEY:}

