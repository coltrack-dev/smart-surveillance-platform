spring:
  datasource:
    url: jdbc:h2:mem:analytics_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092

analytics:
  snapshots:
    s3:
      endpoint: http://localhost:9000
      region: us-east-1
      bucket: test-bucket
      access-key: test-access-key
      secret-key: test-secret-key
      prefix: analytics/snapshots

management:
  endpoints:
    web:
      exposure:
        include: health,info
