spring:
  application:
    name: analytics-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.13.128:5432/surveillance_db}
    username: ${SPRING_DATASOURCE_USERNAME:surveillance_user}
    password: ${SPRING_DATASOURCE_PASSWORD:surveillance_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.value.default.type: com.coltrack.events.analytics.AnalyticsEvent
        spring.json.trusted.packages: com.coltrack.events.analytics
        spring.json.use.type.headers: false

    listener:
      ack-mode: record

server:
  port: 8097

camera-service:
  url: ${CAMERA_SERVICE_URL:http://localhost:8091}

analytics:
  kafka:
    topic: ${ANALYTICS_KAFKA_TOPIC:analytics.events}
    jobs-topic: ${ANALYTICS_JOBS_TOPIC:analytics.jobs}
    job-status-topic: ${ANALYTICS_JOB_STATUS_TOPIC:analytics.job-status}
    worker-heartbeat-topic: ${ANALYTICS_WORKER_HEARTBEAT_TOPIC:analytics.worker-heartbeat}
    control-group-id: ${ANALYTICS_CONTROL_GROUP_ID:analytics-service-control}

  workers:
    online-timeout: ${ANALYTICS_WORKER_ONLINE_TIMEOUT:45s}

  input:
    file: ${ANALYTICS_INPUT_FILE:./data/analytics/input/people.mp4}

  snapshots:
    s3:
      endpoint: ${WASABI_ENDPOINT}
      region: ${WASABI_REGION:us-central-1}
      bucket: ${WASABI_BUCKET}
      access-key: ${WASABI_ACCESS_KEY}
      secret-key: ${WASABI_SECRET_KEY}
      prefix: ${ANALYTICS_SNAPSHOTS_S3_PREFIX:analytics/snapshots}
