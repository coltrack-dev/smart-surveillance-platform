name: surveillance-streaming

# Private streaming foundation; not a public SaaS ingress until gateway auth
# and tenant-scoped playback exist. Sample publishers are intentionally absent.
services:
  streaming-postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming_admin
      POSTGRES_PASSWORD: ${STREAMING_DB_ADMIN_PASSWORD:?Set the Streaming PostgreSQL bootstrap administrator password}
      STREAMING_IDENTITY_RUNTIME_PASSWORD: ${STREAMING_IDENTITY_RUNTIME_PASSWORD:?Set the Identity runtime database password}
      STREAMING_IDENTITY_MIGRATOR_PASSWORD: ${STREAMING_IDENTITY_MIGRATOR_PASSWORD:?Set the Identity migration database password}
      STREAMING_CAMERA_RUNTIME_PASSWORD: ${STREAMING_CAMERA_RUNTIME_PASSWORD:?Set the Camera runtime database password}
      STREAMING_CAMERA_MIGRATOR_PASSWORD: ${STREAMING_CAMERA_MIGRATOR_PASSWORD:?Set the Camera migration database password}
      STREAMING_STREAM_RUNTIME_PASSWORD: ${STREAMING_STREAM_RUNTIME_PASSWORD:?Set the Stream runtime database password}
      STREAMING_STREAM_MIGRATOR_PASSWORD: ${STREAMING_STREAM_MIGRATOR_PASSWORD:?Set the Stream migration database password}
      STREAMING_WEBSOCKET_RUNTIME_PASSWORD: ${STREAMING_WEBSOCKET_RUNTIME_PASSWORD:?Set the WebSocket runtime database password}
    volumes:
      - streaming-db-data:/var/lib/postgresql/data
      - ./docker/streaming-db-roles.sql:/docker-entrypoint-initdb.d/000-streaming-db-roles.sql:ro
      - ./docker/streaming-db-init.sql:/docker-entrypoint-initdb.d/001-streaming-schema.sql:ro
      - ./docker/002-streaming-initial-owners.sql:/docker-entrypoint-initdb.d/002-streaming-initial-owners.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming_admin -d streaming"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak-postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a dedicated Keycloak database password}
    volumes:
      - streaming-keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a dedicated Keycloak database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set a local Keycloak admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a local Keycloak admin password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${STREAMING_OIDC_BASE_URL:?Set the browser-visible Keycloak base URL}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-streaming-dev.json:/opt/keycloak/data/import/realm-streaming-dev.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - streaming-kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.13.1
    environment:
      MTX_AUTHINTERNALUSERS_0_USER: ${STREAMING_MEDIA_PUBLISH_USER:?Set a MediaMTX publish username}
      MTX_AUTHINTERNALUSERS_0_PASS: ${STREAMING_MEDIA_PUBLISH_PASSWORD:?Set a long random MediaMTX publish password}
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_PATH: "~^[0-9a-f-]{36}$"
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_PATH: "~^[0-9a-f-]{36}$"
      MTX_AUTHINTERNALUSERS_1_USER: ${STREAMING_MEDIA_READ_USER:?Set a MediaMTX read username}
      MTX_AUTHINTERNALUSERS_1_PASS: ${STREAMING_MEDIA_READ_PASSWORD:?Set a long random MediaMTX read password}
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: read
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_PATH: "~^[0-9a-f-]{36}$"
    volumes:
      - ./docker/mediamtx.streaming.yml:/mediamtx.yml:ro
    expose:
      - "8554"
      - "8888"
    restart: unless-stopped

  video-ingest-agent:
    build:
      context: ./agents/video-ingest-agent
      dockerfile: Dockerfile
    image: surveillance/video-ingest-agent:streaming
    environment:
      AGENT_ID: ${VIDEO_INGEST_AGENT_ID:-streaming-media-node}
      AGENT_BIND: 0.0.0.0:8098
      AGENT_DATA_DIR: /data
      AGENT_API_TOKEN: ${VIDEO_INGEST_AGENT_TOKEN:?Set a long random ingest token}
      AGENT_READY_TIMEOUT_SECONDS: ${VIDEO_INGEST_AGENT_READY_TIMEOUT_SECONDS:-30}
      AGENT_OUTPUT_READY_TIMEOUT_SECONDS: ${VIDEO_INGEST_AGENT_OUTPUT_READY_TIMEOUT_SECONDS:-15}
      AGENT_OUTPUT_HEALTH_INTERVAL_SECONDS: ${VIDEO_INGEST_AGENT_OUTPUT_HEALTH_INTERVAL_SECONDS:-15}
      AGENT_OUTPUT_STALL_TIMEOUT_SECONDS: ${VIDEO_INGEST_AGENT_OUTPUT_STALL_TIMEOUT_SECONDS:-15}
      AGENT_MAX_PIPELINES: ${VIDEO_INGEST_AGENT_MAX_PIPELINES:-8}
      AGENT_MAX_CONCURRENT_PROBES: ${VIDEO_INGEST_AGENT_MAX_CONCURRENT_PROBES:-4}
      RUST_LOG: ${VIDEO_INGEST_AGENT_LOG_LEVEL:-info}
    expose:
      - "8098"
    depends_on:
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8098/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  camera-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:camera-service
        MODULE_DIR: services/camera-service
    image: surveillance/camera-service:streaming
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://streaming-postgres:5432/streaming
      SPRING_DATASOURCE_USERNAME: camera_runtime
      SPRING_DATASOURCE_PASSWORD: ${STREAMING_CAMERA_RUNTIME_PASSWORD:?Set the Camera runtime database password}
      SPRING_FLYWAY_USER: camera_migrator
      SPRING_FLYWAY_PASSWORD: ${STREAMING_CAMERA_MIGRATOR_PASSWORD:?Set the Camera migration database password}
      IDENTITY_QUOTAS_DEFAULT_PLAN: ${IDENTITY_QUOTAS_DEFAULT_PLAN:-FREE}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CAMERA_CREDENTIALS_KEY: ${CAMERA_CREDENTIALS_KEY:?Set a base64 encoded 32-byte key}
      APP_SECURITY_MODE: oidc
      APP_SECURITY_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
      APP_SECURITY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/streaming/protocol/openid-connect/certs
      APP_SECURITY_OIDC_AUDIENCE: streaming-api
      STREAMING_INTERNAL_JWT_SECRET: ${STREAMING_INTERNAL_JWT_SECRET:?Set a base64 encoded 32-byte internal service key}
      JAVA_OPTS: ${CAMERA_JAVA_OPTS:--Xms128m -Xmx384m}
    depends_on:
      streaming-postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  stream-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:stream-service
        MODULE_DIR: services/stream-service
    image: surveillance/stream-service:streaming
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://streaming-postgres:5432/streaming
      SPRING_DATASOURCE_USERNAME: stream_runtime
      SPRING_DATASOURCE_PASSWORD: ${STREAMING_STREAM_RUNTIME_PASSWORD:?Set the Stream runtime database password}
      SPRING_FLYWAY_USER: stream_migrator
      SPRING_FLYWAY_PASSWORD: ${STREAMING_STREAM_MIGRATOR_PASSWORD:?Set the Stream migration database password}
      IDENTITY_QUOTAS_DEFAULT_PLAN: ${IDENTITY_QUOTAS_DEFAULT_PLAN:-FREE}
      APP_SECURITY_MODE: oidc
      APP_SECURITY_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
      APP_SECURITY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/streaming/protocol/openid-connect/certs
      APP_SECURITY_OIDC_AUDIENCE: streaming-api
      STREAMING_INTERNAL_JWT_SECRET: ${STREAMING_INTERNAL_JWT_SECRET:?Set a base64 encoded 32-byte internal service key}
      CAMERA_SERVICE_URL: http://camera-service:8091
      STREAM_HLS_PATH: /data/hls
      STREAM_INGEST_AGENT_ENABLED: "true"
      STREAM_INGEST_AGENT_URL: http://video-ingest-agent:8098
      STREAM_INGEST_AGENT_TOKEN: ${VIDEO_INGEST_AGENT_TOKEN:?Set a long random ingest token}
      STREAM_INGEST_AGENT_PUBLISH_RTSP_BASE_URL: rtsp://${STREAMING_MEDIA_PUBLISH_USER:?Set a MediaMTX publish username}:${STREAMING_MEDIA_PUBLISH_PASSWORD:?Set a long random MediaMTX publish password}@mediamtx:8554
      STREAM_INGEST_AGENT_INTERNAL_HLS_BASE_URL: http://mediamtx:8888
      STREAM_INGEST_AGENT_PUBLIC_HLS_PREFIX: /media-hls
      STREAMING_MEDIA_READ_USER: ${STREAMING_MEDIA_READ_USER:?Set a MediaMTX read username}
      STREAMING_MEDIA_READ_PASSWORD: ${STREAMING_MEDIA_READ_PASSWORD:?Set a long random MediaMTX read password}
      BROADCAST_PLAYBACK_SECRET: ${BROADCAST_PLAYBACK_SECRET:?Set a long random playback signing secret}
      BROADCAST_PLAYBACK_TTL: ${BROADCAST_PLAYBACK_TTL:-PT10M}
      BROADCAST_VIEWER_SESSION_TTL: ${BROADCAST_VIEWER_SESSION_TTL:-PT90S}
      BROADCAST_PLAYER_BASE_URL: ${BROADCAST_PLAYER_BASE_URL:-http://localhost:5173/watch}
      BROADCAST_RATE_LIMIT_PER_MINUTE: ${BROADCAST_RATE_LIMIT_PER_MINUTE:-300}
      CORS_ALLOWED_ORIGIN: ${BROADCAST_PLAYER_ORIGIN:-http://localhost:5173}
      JAVA_OPTS: ${STREAM_JAVA_OPTS:--Xms128m -Xmx384m}
    volumes:
      - streaming-hls-data:/data/hls
    depends_on:
      streaming-postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      kafka:
        condition: service_started
      camera-service:
        condition: service_started
      mediamtx:
        condition: service_started
      video-ingest-agent:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:identity-service
        MODULE_DIR: services/identity-service
    image: surveillance/identity-service:streaming
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://streaming-postgres:5432/streaming
      SPRING_DATASOURCE_USERNAME: identity_runtime
      SPRING_DATASOURCE_PASSWORD: ${STREAMING_IDENTITY_RUNTIME_PASSWORD:?Set the Identity runtime database password}
      SPRING_FLYWAY_USER: identity_migrator
      SPRING_FLYWAY_PASSWORD: ${STREAMING_IDENTITY_MIGRATOR_PASSWORD:?Set the Identity migration database password}
      APP_SECURITY_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
      APP_SECURITY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/streaming/protocol/openid-connect/certs
      APP_SECURITY_OIDC_AUDIENCE: streaming-api
      IDENTITY_INVITATIONS_DEVELOPMENT_LINK_ENABLED: ${IDENTITY_INVITATIONS_DEVELOPMENT_LINK_ENABLED:-false}
      IDENTITY_INVITATIONS_PUBLIC_BASE_URL: ${IDENTITY_INVITATIONS_PUBLIC_BASE_URL:-http://localhost:5173}
      IDENTITY_QUOTAS_DEFAULT_PLAN: ${IDENTITY_QUOTAS_DEFAULT_PLAN:-FREE}
      JAVA_OPTS: ${IDENTITY_JAVA_OPTS:--Xms96m -Xmx256m}
    depends_on:
      streaming-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8099/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: services:websocket-service
        MODULE_DIR: services/websocket-service
    image: surveillance/websocket-service:streaming
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://streaming-postgres:5432/streaming
      SPRING_DATASOURCE_USERNAME: websocket_runtime
      SPRING_DATASOURCE_PASSWORD: ${STREAMING_WEBSOCKET_RUNTIME_PASSWORD:?Set the WebSocket runtime database password}
      APP_SECURITY_MODE: oidc
      APP_SECURITY_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
      APP_SECURITY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/streaming/protocol/openid-connect/certs
      APP_SECURITY_OIDC_AUDIENCE: streaming-api
      APP_WEBSOCKET_ALLOWED_ORIGINS: ${BROADCAST_PLAYER_ORIGIN:-http://localhost:5173}
      JAVA_OPTS: ${WEBSOCKET_JAVA_OPTS:--Xms96m -Xmx256m}
    depends_on:
      kafka:
        condition: service_started
      streaming-postgres:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      camera-service:
        condition: service_started
    restart: unless-stopped

  camera-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        GRADLE_MODULE: gateway:camera-gateway
        MODULE_DIR: gateway/camera-gateway
    image: surveillance/camera-gateway:streaming
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xms96m -Xmx256m}
      APP_SECURITY_MODE: oidc
      APP_SECURITY_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
      APP_SECURITY_OIDC_JWK_SET_URI: http://keycloak:8080/realms/streaming/protocol/openid-connect/certs
      APP_SECURITY_OIDC_AUDIENCE: streaming-api
      CAMERA_SERVICE_URL: http://camera-service:8091
      STREAM_SERVICE_URL: http://stream-service:8094
      IDENTITY_SERVICE_URL: http://identity-service:8099
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      WEBSOCKET_SERVICE_URL: ws://websocket-service:8096
      CORS_ALLOWED_ORIGIN: ${BROADCAST_PLAYER_ORIGIN:-http://localhost:5173}
    ports:
      - "${STREAMING_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${STREAMING_GATEWAY_PORT:-8081}:8080"
    depends_on:
      camera-service:
        condition: service_started
      stream-service:
        condition: service_started
      websocket-service:
        condition: service_started
      keycloak:
        condition: service_started
      mediamtx:
        condition: service_started
      identity-service:
        condition: service_healthy
    restart: unless-stopped

  broadcast-player:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${BROADCAST_API_URL:-http://localhost:8081/api}
        VITE_AUTH_MODE: oidc
        VITE_OIDC_ISSUER_URI: ${STREAMING_OIDC_ISSUER_URI:?Set the Keycloak realm issuer URL}
        VITE_OIDC_CLIENT_ID: streaming-vue
        VITE_OIDC_REALM: streaming
        VITE_OIDC_REDIRECT_URI: ${STREAMING_OIDC_REDIRECT_URI:-http://localhost:5173/}
    image: surveillance/broadcast-player:streaming
    ports:
      - "${BROADCAST_PLAYER_BIND_ADDRESS:-127.0.0.1}:${BROADCAST_PLAYER_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  streaming-kafka-data:
  streaming-hls-data:
  streaming-db-data:
  streaming-keycloak-db-data:
